name: AI agent repository hardening audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.mcp.json'
      - 'mcp.json'
      - '.claude/**'
      - '.cursor/**'
      - '.github/workflows/**'
      - '.github/instructions/**'
      - '.github/agents/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: OssaBellator/claude-code-mcp-hardening@v1
